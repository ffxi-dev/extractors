# What the Dockerfile checks: ruff, the tests with every pin, and indexing the fixtures.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # lsb's runners while the repository is private; they refuse public repositories, which GitHub's run free.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","lsb"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # PACKETS_DEPLOY_KEY goes once packets is public (open-extractors 4.3), and the secret with it.
      - env:
          PACKETS_KEY: ${{ secrets.PACKETS_DEPLOY_KEY }}
        run: >-
          docker build --progress plain --secret id=packets_key,env=PACKETS_KEY
          -t extractors-test:${{ github.sha }} .
      - if: always()
        run: docker image rm extractors-test:${{ github.sha }} || true
