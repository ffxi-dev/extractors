# ClickHouse for working on the extractors: `docker compose up -d --wait`. The version Scholar runs; bump both
# at once. It answers on 127.0.0.1 only, as ffxi with password ffxi.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports: ["127.0.0.1:8123:8123"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"]
      interval: 2s
      retries: 60
    volumes:
      - data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/ffxi.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/ffxi.xml:ro

volumes:
  data:
