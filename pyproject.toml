[project]
name = "ffxi-extractors"
version = "5.0.0"
description = "Turns FFXI captures into ClickHouse tables and findings: Scholar's extractors and derived facts"
license = "GPL-3.0-only"
# Below 3.14: Sink.flush tells a finished row by its reference count, which 3.14's stack references may change.
requires-python = ">=3.13,<3.14"
# The decoder's release is part of every unit's version and of the pins, so it is exact; uv.lock holds the
# rest exactly, and a project that installs this one may resolve them within these ranges.
dependencies = [
    "clickhouse-connect>=1.12,<2",
    "ffxi-packets==1.6.0",
    "numpy>=2.5,<3",
    "pyarrow>=26,<27",
    "xicap>=7.2,<8",
]

[project.scripts]
ffxi-extractors = "ffxi_extractors.cli:main"

[dependency-groups]
dev = ["mypy==1.18.2", "pytest==9.2.0", "ruff==0.17.3"]

[tool.uv.sources]
xicap = { git = "https://github.com/ffxi-dev/xicap", tag = "v7.2.0", subdirectory = "bindings/python" }
ffxi-packets = { git = "https://github.com/ffxi-dev/packets", tag = "v1.6.0" }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffxi_extractors"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
packages = ["ffxi_extractors"]

# No type information ships with these.
[[tool.mypy.overrides]]
module = ["xicap", "ffxi_packets", "clickhouse_connect.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PERF", "RET", "RUF", "BLE", "N", "A", "FURB", "LOG", "PL", "ERA"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLC0415", "PLW0603", "N818"]
