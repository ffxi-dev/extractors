[project]
name = "ffxi-extractors"
version = "2.0.3"
description = "Turns FFXI captures into ClickHouse tables and findings: Scholar's extractors and derived facts"
license = "GPL-3.0-only"
# The Python Scholar runs, which extractors_rs is built for.
requires-python = ">=3.13,<3.14"
# uv.lock holds these exactly, and a project that installs this one may resolve them within these ranges. The
# packets release the decoder reads is rust/xc-decode/packets' (decode.PACKETS).
dependencies = [
    "clickhouse-connect>=1.12,<2",
    "pyarrow>=26,<27",
    "xicap>=7.2,<8",
]

[project.scripts]
ffxi-extractors = "ffxi_extractors.cli:main"

[dependency-groups]
dev = ["mypy==1.18.2", "pytest==9.2.0", "ruff==0.17.3"]

[tool.uv.sources]
# The same tag as rust/xc-core/build.rs's XICAP_TAG, which the Rust reader compiles.
xicap = { git = "https://github.com/ffxi-dev/xicap", tag = "v7.2.0", subdirectory = "bindings/python" }

# One wheel: the Python package and the Rust extractors (extractors_rs). Building it needs Rust, gcc 14 or newer,
# git, and zstd's headers.
[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/xc-py/Cargo.toml"
module-name = "extractors_rs"
python-packages = ["ffxi_extractors"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
packages = ["ffxi_extractors"]

# No type information ships with these.
[[tool.mypy.overrides]]
module = ["xicap", "extractors_rs", "clickhouse_connect.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PERF", "RET", "RUF", "BLE", "N", "A", "FURB", "LOG", "PL", "ERA"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLC0415", "PLW0603", "N818"]
