[package]
name = "xc-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "extractors_rs: the Rust extractors for Python, rows as pyarrow tables"
publish = false

[lib]
name = "extractors_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27"
xc-core = { path = "../xc-core" }
xc-all = { path = "../xc-all" }
