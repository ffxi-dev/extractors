# The Rust extractors as a Python module: `maturin build --release` here. Needs XICAP_SRC (see xc-core/build.rs).
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "extractors-rs"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
dependencies = ["pyarrow>=26,<27"]

[tool.maturin]
module-name = "extractors_rs"
features = ["pyo3/extension-module"]
